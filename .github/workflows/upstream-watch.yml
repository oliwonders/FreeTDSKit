# Watches for new FreeTDS and OpenSSL releases and opens a pull request that
# moves FreeTDSKit to them. Both are compiled into every app that uses
# FreeTDSKit and don't update with macOS, so a fix upstream reaches users only
# when the XCFramework is rebuilt and a new FreeTDSKit is tagged.
#
# The pull request carries the new pins (Support/bump-upstream.sh checks each
# checksum against two sources), an unsigned XCFramework built here, and the
# results of the unit tests and iOS builds. It never merges or tags: before
# tagging, rebuild and sign on a Mac and run the Docker integration tests
# there. The pull request's description lists the commands.
#
# If the build or tests fail -- most often a FreeTDS patch that no longer
# applies -- it opens an issue instead.
#
# Needs Settings ▸ Actions ▸ General ▸ "Allow GitHub Actions to create and
# approve pull requests".
name: Upstream release watch

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, 13:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test, but don't push a branch or open a pull request"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      freetds_latest: ${{ steps.check.outputs.freetds_latest }}
      openssl_latest: ${{ steps.check.outputs.openssl_latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned versions with upstream
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: Support/bump-upstream.sh --check

  update:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Validated by bump-upstream.sh (digits and dots only).
      FREETDS_LATEST: ${{ needs.check.outputs.freetds_latest }}
      OPENSSL_LATEST: ${{ needs.check.outputs.openssl_latest }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if a pull request for these versions is already open
        id: existing
        run: |
          set -euo pipefail
          branch="upstream/freetds-${FREETDS_LATEST}-openssl-${OPENSSL_LATEST}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request from $branch is already open."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin the new versions
        if: steps.existing.outputs.skip == 'false'
        id: bump
        run: |
          set -euo pipefail
          SUMMARY_FILE="$RUNNER_TEMP/summary.md" Support/bump-upstream.sh
          if git diff --quiet Support/buildandlinkfreetds.sh; then
            echo "Nothing could be pinned yet (see above); no pull request this time."
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          else
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the XCFramework
        if: steps.bump.outputs.pinned == 'true'
        run: |
          set -o pipefail
          ./Support/buildandlinkfreetds.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Check the FreeTDS version compiled into each slice
        if: steps.bump.outputs.pinned == 'true'
        run: |
          set -euo pipefail
          freetds=$(sed -n 's/^FREETDS_VERSION="\(.*\)"$/\1/p' Support/buildandlinkfreetds.sh)
          for binary in Frameworks/FreeTDS.xcframework/*/FreeTDS.framework/FreeTDS; do
            strings "$binary" | grep -qF "freetds v$freetds" \
              || { echo "❌ $binary doesn't report FreeTDS $freetds"; exit 1; }
          done
          echo "✅ every slice reports FreeTDS $freetds"

      - name: Unit tests (macOS)
        if: steps.bump.outputs.pinned == 'true'
        run: swift test --filter FreeTDSKitTests

      - name: Unit tests (iOS Simulator)
        if: steps.bump.outputs.pinned == 'true'
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -scheme FreeTDSKit -destination "id=$device" \
            -only-testing:FreeTDSKitTests

      - name: Build for iOS
        if: steps.bump.outputs.pinned == 'true'
        run: xcodebuild build -scheme FreeTDSKit -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

      - name: Open a pull request
        if: steps.bump.outputs.pinned == 'true' && env.DRY_RUN != 'true'
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          set -euo pipefail
          freetds=$(sed -n 's/^FREETDS_VERSION="\(.*\)"$/\1/p' Support/buildandlinkfreetds.sh)
          openssl=$(sed -n 's/^OPENSSL_VERSION="\(.*\)"$/\1/p' Support/buildandlinkfreetds.sh)
          title="FreeTDS $freetds, OpenSSL $openssl"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add Support/buildandlinkfreetds.sh Frameworks/FreeTDS.xcframework
          git commit -m "$title" -m "Pinned and built by the upstream release watch. Unsigned: rebuild and sign before tagging."
          git push origin "$BRANCH"

          # The watcher's older "… is out" issues that this supersedes.
          closes=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title | test("^(FreeTDS|OpenSSL) [0-9.]+ is out")) | "Closes #\(.number)"')

          {
            echo "Moves FreeTDSKit to FreeTDS $freetds and OpenSSL $openssl."
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Checked here: the build for macOS, iOS and the iOS Simulator; the FreeTDS version compiled into every slice; the unit tests on macOS and the iOS Simulator."
            echo
            echo "**Before tagging, on a Mac.** The XCFramework here is unsigned, and the integration tests need Docker:"
            echo
            echo '```bash'
            echo "git fetch origin && git switch $BRANCH"
            echo 'FREETDSKIT_CODESIGN_IDENTITY="Developer ID Application: …" ./Support/buildandlinkfreetds.sh'
            echo './Tests/FreeTDSKitIntegrationTests/run-integration-tests.sh'
            echo 'FREETDSKIT_TLS_TEST_HOST=<your server>.database.windows.net swift test --filter TLSVerification'
            echo 'git commit -am "Sign the XCFramework" && git push'
            echo '```'
            echo
            echo "Then merge, tag a FreeTDSKit release, and update the apps that use it. Check FreeTDS's NEWS for security fixes, and whether \`Support/patches\` still needs every hunk (see its README)."
            echo
            echo "$closes"
          } > "$RUNNER_TEMP/body.md"

          gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"

      - name: Open an issue if the update failed
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Upstream update to FreeTDS ${FREETDS_LATEST} / OpenSSL ${OPENSSL_LATEST} failed"
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already open: $title"; exit 0
          fi
          {
            echo "The upstream release watch couldn't build or test the new versions: $RUN_URL"
            echo
            echo "A FreeTDS patch that no longer applies stops the build; see \`Support/patches/README.md\`."
            if [ -f "$RUNNER_TEMP/build.log" ]; then
              echo; echo '```'; tail -60 "$RUNNER_TEMP/build.log"; echo '```'
            fi
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md" --label security \
            || gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
